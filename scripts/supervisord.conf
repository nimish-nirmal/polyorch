[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nats-server]
command=/usr/bin/nats-server -js -sd /data/nats
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:polyorch-api]
command=/app/polyorch-api
environment=PORT="8082",DB_PATH="/data/polyorch.db",NATS_URL="nats://127.0.0.1:4222"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:polyorch-worker]
command=/app/polyorch-worker
environment=DB_PATH="/data/polyorch.db",NATS_URL="nats://127.0.0.1:4222",RUNS_TMP_DIR="/tmp/runs"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[group:polyorch]
programs=nats-server,polyorch-api,polyorch-worker
